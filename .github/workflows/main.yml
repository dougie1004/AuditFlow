name: Build and Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Typescript Type Check
      run: npx tsc --noEmit

    - name: Rust Type Check
      run: cd src-tauri && cargo check

    - name: Rust Tests
      run: cd src-tauri && cargo test --lib scenarios_seeder::tests::test_master_scenarios_integrity

    - name: Build
      run: npm run build
